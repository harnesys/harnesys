      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4a1d07" flood-opacity="0.3"></feDropShadow>
    </filter>
  </defs><rect width="512" height="512" rx="120" fill="url(#bg)"></rect><g clip-path="url(#tile)">
