# harnesys — host API + web UI.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Host only (no UI): deploy/docker-compose.host.yml
#
# Build context is the repo root. Images tagged ghcr.io/harnesys/{host,web}.

name: harnesys

x-host-environment: &host-environment
  NODE_ENV: production
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: 47474
  PORT: 47474
  PUBLIC_URL: ${PUBLIC_URL:-}
  HARNESYS_HOME: /data
  HARNESYS_MASTER_KEY: ${HARNESYS_MASTER_KEY:-}
  HARNESYS_GOOGLE_CLIENT_ID: ${HARNESYS_GOOGLE_CLIENT_ID:-}
  HARNESYS_GOOGLE_DEVICE_CLIENT_ID: ${HARNESYS_GOOGLE_DEVICE_CLIENT_ID:-}
  HARNESYS_GOOGLE_DEVICE_CLIENT_SECRET: ${HARNESYS_GOOGLE_DEVICE_CLIENT_SECRET:-}
  HARNESYS_GOOGLE_API_KEY: ${HARNESYS_GOOGLE_API_KEY:-}
  HARNESYS_GOOGLE_APP_ID: ${HARNESYS_GOOGLE_APP_ID:-}

services:
  host:
    build:
      context: ..
      dockerfile: deploy/host.Dockerfile
    image: ghcr.io/harnesys/host
    environment:
      <<: *host-environment
    expose:
      - "47474"
    volumes:
      - harnesys-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:47474/health/live'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: ghcr.io/harnesys/web
    environment:
      NODE_ENV: production
      HARNESYS_WEB_PORT: 8080
      HARNESYS_UPSTREAM: ${UPSTREAM:-http://host:47474}
      HARNESYS_WEB_STATIC: /srv/dist
      WEB_PORT: 8080
      UPSTREAM: ${UPSTREAM:-http://host:47474}
      STATIC_DIR: /srv/dist
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      host:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8080/healthz'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  searxng:
    profiles: ["search"]
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-harnesys-local}
    volumes:
      - ./searxng:/etc/searxng:ro
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  harnesys-data:
