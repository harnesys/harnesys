name: Feature request
description: Suggest an improvement to Harnesys
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change, concretely.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other approaches you considered or use now.
