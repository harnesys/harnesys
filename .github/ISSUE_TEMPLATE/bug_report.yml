name: Bug report
description: Report a problem with Harnesys
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Security issues go to email, not here (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop app
        - Web UI (self-hosted / Docker)
        - Host API
        - CLI
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.10.4 / ghcr.io/harnesys/harnesys:latest digest
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Console output, container logs, screenshots. Remove secrets and tokens.
