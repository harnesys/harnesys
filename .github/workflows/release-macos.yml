name: release-macos
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install
      - name: Build bundles
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HARNESYS_GOOGLE_CLIENT_ID: ${{ secrets.HARNESYS_GOOGLE_CLIENT_ID }}
          HARNESYS_GOOGLE_API_KEY: ${{ secrets.HARNESYS_GOOGLE_API_KEY }}
          HARNESYS_GOOGLE_APP_ID: ${{ secrets.HARNESYS_GOOGLE_APP_ID }}
        run: bun run build:desktop --target ${{ matrix.target }}
      - name: Rename macOS updater artifact
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            *aarch64*) arch=aarch64 ;;
            *) arch=x64 ;;
          esac
          for f in *.app.tar.gz; do
            [ -e "$f" ] || continue
            [ "$f" = "Harnesys_${arch}.app.tar.gz" ] && continue
            mv -f "$f" "Harnesys_${arch}.app.tar.gz"
            mv -f "$f.sig" "Harnesys_${arch}.app.tar.gz.sig"
          done
          ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    needs: [desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Flatten desktop bundle names
        working-directory: dist
        run: |
          find . -mindepth 2 -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          shopt -s nullglob
          for f in *_aarch64.dmg; do mv -f "$f" Harnesys_aarch64.dmg; done
          for f in *_x64.dmg; do mv -f "$f" Harnesys_x64.dmg; done
          ls -la
      - name: Extract release notes from tag
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > body.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --notes-file body.md --generate-notes dist/*
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          base="https://github.com/harnesys/harnesys/releases/download/${tag}"
          notes="$(gh release view "$tag" --json body -q .body)"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg da_url "${base}/Harnesys_aarch64.app.tar.gz" \
            --arg da_sig "$(cat dist/Harnesys_aarch64.app.tar.gz.sig)" \
            --arg dx_url "${base}/Harnesys_x64.app.tar.gz" \
            --arg dx_sig "$(cat dist/Harnesys_x64.app.tar.gz.sig)" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $da_sig, url: $da_url },
                "darwin-x86_64": { signature: $dx_sig, url: $dx_url }
              }
            }' > dist/latest.json
          cat dist/latest.json
          gh release upload "$tag" dist/latest.json --clobber
