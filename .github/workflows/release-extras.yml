name: release-extras
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [bun-linux-x64, bun-linux-arm64, bun-darwin-x64, bun-darwin-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build binaries
        run: |
          t=${{ matrix.target }}
          bun build --compile --target=$t apps/server/src/main.ts --outfile harnesys-host
          bun build --compile --target=$t apps/webui/server/index.ts --outfile harnesys-web
          bun build --compile --target=$t apps/cli/src/index.ts --outfile harnesys
          mkdir -p out
          suffix=${t#bun-}
          for bin in harnesys harnesys-host harnesys-web; do
            mv "$bin" "out/$bin-$suffix"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: out/*

  client-dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:client
      - run: (cd apps/webui && zip -qr ../../client-dist.zip dist)
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client-dist.zip

  release:
    needs: [server, client-dist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Extract release notes from tag
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > body.md
      - name: Attach extras to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --notes-file body.md --generate-notes dist/* 2>/dev/null \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
