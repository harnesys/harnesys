name: release-windows
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install
      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build:desktop --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  release:
    needs: [desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Flatten bundle names
        working-directory: dist
        run: |
          find . -mindepth 2 -type f \( -name '*-setup.exe' -o -name '*-setup.exe.sig' \) -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          shopt -s nullglob
          for f in *_x64-setup.exe; do mv -f "$f" Harnesys_x64-setup.exe; done
          for f in *_x64-setup.exe.sig; do mv -f "$f" Harnesys_x64-setup.exe.sig; done
          for f in *_arm64-setup.exe; do mv -f "$f" Harnesys_arm64-setup.exe; done
          for f in *_arm64-setup.exe.sig; do mv -f "$f" Harnesys_arm64-setup.exe.sig; done
          ls -la
      - name: Extract release notes from tag
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > body.md
      - name: Attach bundles to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --notes-file body.md --generate-notes dist/* 2>/dev/null \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Merge platforms into latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          base="https://github.com/harnesys/harnesys/releases/download/${tag}"
          rm -f latest.json
          gh release download "$tag" --pattern latest.json --clobber 2>/dev/null || true
          if [ ! -f latest.json ]; then
            printf '{"version":"%s","notes":"","pub_date":"","platforms":{}}\n' "$version" > latest.json
          fi
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wx_url "${base}/Harnesys_x64-setup.exe" \
            --arg wx_sig "$(cat dist/Harnesys_x64-setup.exe.sig)" \
            --arg wa_url "${base}/Harnesys_arm64-setup.exe" \
            --arg wa_sig "$(cat dist/Harnesys_arm64-setup.exe.sig)" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $wx_sig, url: $wx_url },
                "windows-aarch64": { signature: $wa_sig, url: $wa_url }
              }
            }' > windows.json
          jq -s '
            .[0].platforms += .[1].platforms
            | if .[0].notes == "" then .[0].notes = .[1].notes else . end
            | if .[0].pub_date == "" then .[0].pub_date = .[1].pub_date else . end
            | .[0]
          ' latest.json windows.json > merged.json
          mv merged.json latest.json
          cat latest.json
          gh release upload "$tag" latest.json --clobber
